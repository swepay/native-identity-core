name: .NET

on:
  push:
    branches: [main, develop]
    tags:
      - "v*"
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --settings coverlet.runsettings --verbosity normal --collect:"XPlat Code Coverage"

      - name: Verify formatting
        run: dotnet format --verify-no-changes

      - name: Upload coverage reports
        uses: codecov/codecov-action@v6
        with:
          files: ./tests/**/coverage.cobertura.xml
          fail_ci_if_error: false

      - name: Pack NuGet package
        run: dotnet pack src/Native.IdentityCore/Native.IdentityCore.csproj --no-build --configuration Release --output ./nupkg

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: ./nupkg/*.nupkg

  publish:
    name: Publish to NuGet
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download NuGet package artifact
        uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: ./nupkg

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish to NuGet.org
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
